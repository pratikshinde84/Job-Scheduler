# ── Rate Limit settings ───────────────────────────────────────
# Sliding window: each authenticated user gets `limit` requests
# per `window-seconds` rolling window.
# Endpoints matched by `path-prefix` are rate-limited.
#
# Defaults (change as needed):
#   100 requests per 60 seconds per user
#   enqueue endpoint is tighter: 20 requests per 60 seconds
ratelimit.enabled=true
ratelimit.default.limit=100
ratelimit.default.window-seconds=60
ratelimit.enqueue.limit=20
ratelimit.enqueue.window-seconds=60