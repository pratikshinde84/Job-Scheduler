# ── Server ───────────────────────────────────────────────────
# Render provides the PORT environment variable dynamically
server.port=${PORT:8081}

# ── Supabase PostgreSQL (Transaction Pooler — ap-southeast-1) ─
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?user=postgres.zqoyyspgigcugjpnmwus&password=Pratik@216029&prepareThreshold=0&preparedStatementCacheQueries=0}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=60000

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Supabase JWT (ES256 / ECDSA P-256) ───────────────────────
supabase.jwks.url=${SUPABASE_JWKS_URL:https://zqoyyspgigcugjpnmwus.supabase.co/auth/v1/.well-known/jwks.json}

# ── Async thread pool ────────────────────────────────────────
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100

# ── Worker identity & Pool concurrency ───────────────────────
worker.name=worker-1
worker.count=4
worker.name-prefix=worker

# ── CORS ─────────────────────────────────────────────────────
# Comma-separated list of allowed frontend origins (including Vercel URL in production)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Actuator ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

