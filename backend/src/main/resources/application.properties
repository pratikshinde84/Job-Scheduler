# ── Server ───────────────────────────────────────────────────
server.port=8081

# ── Supabase PostgreSQL (Transaction Pooler — ap-southeast-1) ─
# Password: Supabase Dashboard → Settings → Database → Database password
#
# prepareThreshold=0            — disables server-side prepared statements.
#                                 Required for Supabase transaction pooler (port 6543):
#                                 the pooler hands out a fresh backend connection per
#                                 transaction, so named prepared statements created in
#                                 one transaction don't exist in the next. Without this
#                                 flag Hibernate gets "prepared statement S_x already
#                                 exists" / "does not exist" errors.
# preparedStatementCacheQueries=0 — disables the driver-side PS cache for the same reason.
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?user=postgres.zqoyyspgigcugjpnmwus&password=Pratik@216029&prepareThreshold=0&preparedStatementCacheQueries=0
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
# keepaliveTime ensures idle connections stay alive through the pooler's idle timeout.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=60000

# ── JPA / Hibernate ──────────────────────────────────────────
# validate = Hibernate checks schema matches entities but does NOT alter it.
# Schema is managed in Supabase SQL Editor via schema.sql.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Supabase JWT (ES256 / ECDSA P-256) ───────────────────────
# Public keys are fetched from JWKS at startup — no secret needed.
supabase.jwks.url=https://zqoyyspgigcugjpnmwus.supabase.co/auth/v1/.well-known/jwks.json

# ── Async thread pool ────────────────────────────────────────
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100

# ── Worker identity ──────────────────────────────────────────
worker.name=spring-boot-instance-1

# ── CORS ─────────────────────────────────────────────────────
