<style>
        body {
            background-color: #020617; /* Blackest Slate */
        }
        .glass-card {
            background-color: #0F172A; /* Deep Slate Level 1 */
            border: 1px solid #1E293B;
        }
        .form-input-dark {
            background-color: #020617;
            border: 1px solid #334155; /* Slate-700 approximation */
            color: #dae2fd;
        }
        .form-input-dark:focus {
            border-color: #c0c1ff; /* Primary Indigo */
            box-shadow: 0 0 0 2px rgba(192, 193, 255, 0.2); /* 2px outer glow */
            outline: none;
        }
        .btn-primary {
            background-color: #494bd6; /* Inverse-primary for indigo feel */
            color: white;
        }
        .btn-primary:hover {
            background-color: #383bb3;
        }
    </style>

<body class="min-h-screen flex items-center justify-center font-body-md text-on-surface p-container_margin">
<!-- Login Card -->
<main class="glass-card rounded-xl w-full max-w-md p-8 shadow-2xl relative overflow-hidden">
<!-- Subtle decorative glow -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-headline-md text-headline-md text-primary font-bold mb-2 tracking-tight">JobScheduler</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Distributed Engine Authentication</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div>
<label class="block font-mono-label text-mono-label text-outline uppercase mb-2" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-sm">mail</span>
</div>
<input class="form-input-dark block w-full pl-10 pr-3 py-2 rounded-lg font-body-md text-body-md placeholder-on-surface-variant/50 transition-all duration-200" id="email" name="email" placeholder="engineer@organization.alpha" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-mono-label text-mono-label text-outline uppercase mb-2" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-sm">lock</span>
</div>
<input class="form-input-dark block w-full pl-10 pr-3 py-2 rounded-lg font-body-md text-body-md placeholder-on-surface-variant/50 transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="flex items-center justify-between mt-4">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant bg-surface-container text-primary focus:ring-primary focus:ring-offset-background" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
                        Remember session
                    </label>
</div>
<div class="text-sm">
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors duration-200" href="#">Forgot Password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="btn-primary w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg font-title-sm text-title-sm shadow-sm transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-background mt-8" type="submit">
                Sign In
            </button>
</form>
<!-- Footer Links -->
<div class="mt-6 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Need node access? 
                <a class="font-body-sm text-body-sm text-primary hover:text-primary-container font-medium transition-colors duration-200" href="#">Register for a new account</a>
</p>
</div>
</main>
<script>
        // Simple script to add a subtle hover effect to the form fields
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').classList.replace('text-outline-variant', 'text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').classList.replace('text-primary', 'text-outline-variant');
            });
        });
    </script>
</body></html>
